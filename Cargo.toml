[package]
name = "pacwoman"
version = "0.1.8"
edition = "2021"

[[bin]]
name = "pacwoman"
path = "src/main.rs"

[dependencies]
alpm = "5"
ctrlc = "3.5.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[profile.release]
opt-level = 3
strip = true
